name: Accept Contributor Agreement
description: Accept the repository's Contributor Agreement
title: "[Agreement] Acceptance"
labels:
  - pending-agreement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Contributor Agreement

        Blah blah

  - type: text
    id: repository
    attributes:
      label: Project repository
      description: Set the full name of the project repository for which this CLA is being agreed upon, e.g., `w3c-oss/canivc`.

  - type: checkboxes
    id: acceptance
    attributes:
      label: Agreement acceptance
      options:
        - label: I have read and agree to the Contributor Agreement.
          required: true

  - type: checkboxes
    id: identity
    attributes:
      label: Identity confirmation
      options:
        - label: I am submitting this agreement for my own authenticated GitHub account.
          required: true
